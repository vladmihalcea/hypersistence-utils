# Arguments of the forked test JVM (Surefire's argLine).
#
# Maven filters ${console.log.level} into logback-test.xml. Jenesis copies
# resources unfiltered, so Logback resolves the placeholder itself, from this
# system property. DEBUG is the value of the console.log.level property in
# the parent pom.xml.
-Dconsole.log.level\=DEBUG=
