# Environment of the forked test JVM.
#
# Jenesis hands a forked JVM only PATH, HOME, LANG and the platform's own
# variables. A bare name passes the build's own value through, if it is set,
# so Testcontainers finds Docker the same way it does under Maven
# (Colima, Podman, Rancher Desktop or a remote daemon set DOCKER_HOST).
DOCKER_HOST
DOCKER_TLS_VERIFY
DOCKER_CERT_PATH
DOCKER_CONFIG
TESTCONTAINERS_HOST_OVERRIDE
TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE
TESTCONTAINERS_RYUK_DISABLED
