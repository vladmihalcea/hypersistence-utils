# Jenesis builds this project from the existing pom.xml files (the maven layout).
# This file covers only what Jenesis does not read from them: <build><plugins>.
# Every key can be overridden for one run with -D<key>=<value>.

# maven-jar-plugin test-jar execution: stage the -tests jar beside the main jar.
jenesis.stage.tests=true

# The tests of all three modules use the same local databases, and Jenesis runs
# one test JVM per module at once, so one module drops the tables another one is
# using. Run one tool at a time, as Maven runs one module at a time.
jenesis.process.concurrency=1

# Skip recompiling a module's tests when a change to the main classes leaves
# their ABI untouched, e.g. an edited method body. Remove to compare timings
# with Maven's default behaviour.
jenesis.abi.mode=classpath
